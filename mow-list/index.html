<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mow List">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Daily Mow List · Lacrosse Lawn</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #0b0b0b; color: #e8f5e9; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    .bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
      background: #1b5e20; border-bottom: 2px solid #2e7d32;
    }
    .bar strong { font-size: 0.95rem; }
    .bar a, .bar button {
      color: #0b0b0b; background: #a5d6a7; border: 0; border-radius: 8px;
      padding: 8px 12px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer;
    }
    .bar .ghost { background: transparent; color: #c8e6c9; border: 1px solid #81c784; }
    .hint { font-size: 0.75rem; opacity: 0.85; flex: 1 1 100%; }
    body { display: flex; flex-direction: column; }
    .frame-wrap { position: relative; flex: 1; min-height: 0; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    .fallback {
      display: none; padding: 24px 16px; max-width: 420px; margin: 0 auto; line-height: 1.45;
    }
    .fallback.show { display: block; }
    .fallback a { color: #a5d6a7; font-weight: 700; }
  </style>
</head>
<body>
  <header class="bar">
    <strong>Daily Mow List</strong>
    <a id="openSheet" href="https://docs.google.com/spreadsheets/d/1aulqUt_vwpsrAG_3LMirfy9m0JYjTyTPOdA5LK9YUu0/edit" target="_blank" rel="noopener">Open full sheet</a>
    <button type="button" class="ghost" id="reload">Reload</button>
    <p class="hint">Owner: sign into Google to edit. Crew: view if you have the Sheet link. Shell works offline; the list needs network.</p>
  </header>
  <div class="frame-wrap">
    <iframe
      id="sheet"
      title="Daily Mow List Google Sheet"
      src="https://docs.google.com/spreadsheets/d/1aulqUt_vwpsrAG_3LMirfy9m0JYjTyTPOdA5LK9YUu0/edit?usp=sharing&rm=minimal"
      allow="fullscreen"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>
  <div class="fallback" id="fallback">
    <p>If the sheet doesn’t show in this box (some phones block Google embeds), tap <a href="https://docs.google.com/spreadsheets/d/1aulqUt_vwpsrAG_3LMirfy9m0JYjTyTPOdA5LK9YUu0/edit">Open full sheet</a>. The home-screen icon still opens this app.</p>
  </div>
  <script>
    const SHEET = 'https://docs.google.com/spreadsheets/d/1aulqUt_vwpsrAG_3LMirfy9m0JYjTyTPOdA5LK9YUu0/edit?usp=sharing&rm=minimal';
    document.getElementById('reload').addEventListener('click', () => {
      const f = document.getElementById('sheet');
      f.src = SHEET + '&t=' + Date.now();
    });
    // Show fallback tip after a few seconds (iframe blockers won't fire onerror reliably)
    setTimeout(() => document.getElementById('fallback').classList.add('show'), 4000);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
