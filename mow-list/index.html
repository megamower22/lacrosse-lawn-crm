<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mow List">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Daily Mow List · Lacrosse Lawn</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background: #0b0b0b;
      color: #e8f5e9;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .bar {
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: #1b5e20;
      border-bottom: 2px solid #2e7d32;
    }
    .bar strong { display: block; font-size: 1rem; }
    .hint { margin: 3px 0 0; color: #c8e6c9; font-size: 0.8rem; }
    main {
      display: grid;
      min-height: calc(100vh - 73px);
      place-items: center;
      padding: 24px 16px;
      text-align: center;
    }
    .card { width: min(100%, 420px); }
    h1 { margin: 0 0 10px; font-size: 1.35rem; }
    p { line-height: 1.45; }
    .note { color: #c8e6c9; font-size: 0.95rem; }
    .open {
      display: inline-block;
      margin: 12px 0;
      padding: 14px 20px;
      border-radius: 10px;
      background: #a5d6a7;
      color: #0b0b0b;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
    }
    .private { margin: 8px 0 0; color: #9e9e9e; font-size: 0.78rem; }
  </style>
</head>
<body>
  <header class="bar">
    <strong>Lacrosse Lawn · Daily Mow List</strong>
    <p class="hint">Opening the editable list so crew can check off lawns.</p>
  </header>

  <main>
    <section class="card" aria-labelledby="title">
      <h1 id="title">Daily Mow List</h1>
      <p class="note">Crew can tap checkboxes to mark lawns done. The owner sees updates live. Sign into Google if asked.</p>
      <a class="open" href="https://docs.google.com/spreadsheets/d/1aulqUt_vwpsrAG_3LMirfy9m0JYjTyTPOdA5LK9YUu0/edit">Open Daily Mow List</a>
      <p class="private">Keep the sheet link private.</p>
    </section>
  </main>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1aulqUt_vwpsrAG_3LMirfy9m0JYjTyTPOdA5LK9YUu0/edit';

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Give the app shell a moment to render, then open the real Google Sheets UI.
    setTimeout(() => { window.location.href = SHEET_URL; }, 500);
  </script>
</body>
</html>
